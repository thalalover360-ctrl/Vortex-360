<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vortex-360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud">
    <span id="level-title">Level 1: Watch Your Step</span>
    <span id="death-counter">Deaths: 0</span>
  </div>

  <div id="canvas-wrap">
    <canvas id="gameCanvas" width="960" height="450"></canvas>
  </div>

  <!-- Touch Controls -->
  <div id="controls">
    <div class="dpad">
      <button id="btn-left" class="ctrl-btn">◀</button>
      <button id="btn-right" class="ctrl-btn">▶</button>
    </div>
    <div class="actions">
      <button id="btn-jump" class="ctrl-btn jump-btn">▲</button>
    </div>
  </div>

  <!-- Level Complete / Victory Modal -->
  <div id="modal-overlay" class="hidden">
    <div class="modal-card">
      <div class="modal-badge">CLEARED!</div>
      <h2 id="modal-title">Level 1 Complete</h2>
      <p id="modal-stats">Deaths this level: 0</p>
      <button id="btn-next-level" class="neon-btn">NEXT LEVEL ▶</button>
    </div>
  </div>

  <script src="player.js"></script>
  <script src="levels.js"></script>
  <script src="engine.js"></script>
</body>
</html>
